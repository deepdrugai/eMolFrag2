name: Tests & Coverage

on: 
    - push
    - pull_request
    
jobs:
  run:
    name: "(py${{ matrix.python-version }}) eMolFrag Hatch Tests & Coverage"
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ['ubuntu-latest'] # 'ubuntu-latest', 'windows-latest', 'macos-latest'
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Hatch
      run: |
        python -m pip install hatch

    # - name: Run PyTests with Coverage
    #   run: hatch run dev:pytest -vrP --cov --cov-report=term-missing

    - name: Run Hatch Tests
      run: hatch test -c -- -rP

    - name: Ruff Lint & Formatting
      run: hatch fmt

    # - name: Tests
    #   run: hatch run +py=${{ matrix.python-version }} pytest